<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPL & Seeding Management Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pink: { 50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4', 400: '#f472b6', 500: '#ec4899', 600: '#db2777', 700: '#be185d' },
            skyblue: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #fdf2f8; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #fbcfe8; border-radius: 4px; }
  </style>
</head>
<body class="bg-pink-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-pink-100 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-pink-500 text-white p-2 rounded-xl shadow-md">
          <i class="fa-solid fa-chart-line text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 tracking-tight">PPL & Seeding Dashboard</h1>
          <p class="text-xs text-pink-600 font-medium">Onssal & Lume Archive Management</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm transition flex items-center space-x-1.5">
          <i class="fa-solid fa-file-excel"></i>
          <span>엑셀 내보내기</span>
        </button>
        <button onclick="openAddModal()" class="bg-pink-600 hover:bg-pink-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-sm transition flex items-center space-x-1.5">
          <i class="fa-solid fa-plus"></i>
          <span>새 항목 추가</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    
    <!-- Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-pink-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500">전체 캠페인</p>
          <h3 id="totalCount" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-pink-50 text-pink-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-bullhorn"></i>
        </div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-pink-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500">진행 중 (In Progress)</p>
          <h3 id="progressCount" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-spinner"></i>
        </div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-pink-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500">완료됨 (Completed)</p>
          <h3 id="completedCount" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-circle-check"></i>
        </div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-pink-100 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500">총 예산 / 집행비</p>
          <h3 id="totalBudget" class="text-lg font-bold text-slate-900 mt-1">₩0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-won-sign"></i>
        </div>
      </div>
    </div>

    <!-- Filters & Search Bar -->
    <div class="bg-white p-4 rounded-2xl border border-pink-100 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-2 w-full sm:w-auto">
        <div class="relative w-full sm:w-72">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
            <i class="fa-solid fa-search text-xs"></i>
          </span>
          <input type="text" id="searchInput" oninput="filterTable()" placeholder="인플루언서, 브랜드, 채널 검색..." class="w-full pl-9 pr-4 py-2 bg-pink-50/50 border border-pink-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>
      </div>
      <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
        <select id="statusFilter" onchange="filterTable()" class="bg-pink-50/50 border border-pink-200 rounded-xl text-xs py-2 px-3 focus:outline-none focus:ring-2 focus:ring-pink-500">
          <option value="">모든 상태</option>
          <option value="진행중">진행중</option>
          <option value="완료">완료</option>
          <option value="대기중">대기중</option>
        </select>
        <select id="brandFilter" onchange="filterTable()" class="bg-pink-50/50 border border-pink-200 rounded-xl text-xs py-2 px-3 focus:outline-none focus:ring-2 focus:ring-pink-500">
          <option value="">모든 브랜드</option>
          <option value="온살">온살</option>
          <option value="루메아카이브">루메아카이브</option>
        </select>
      </div>
    </div>

    <!-- Data Table -->
    <div class="bg-white rounded-2xl border border-pink-100 shadow-sm overflow-hidden flex flex-col">
      <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-pink-50/70 border-b border-pink-100 text-slate-600 font-semibold">
              <th class="py-3 px-4">ID</th>
              <th class="py-3 px-4">구분</th>
              <th class="py-3 px-4">브랜드</th>
              <th class="py-3 px-4">인플루언서 / 채널</th>
              <th class="py-3 px-4">상태</th>
              <th class="py-3 px-4">진행 일정</th>
              <th class="py-3 px-4 text-right">예산</th>
              <th class="py-3 px-4 text-center">관리</th>
            </tr>
          </thead>
          <tbody id="dataTableBody" class="divide-y divide-pink-50 text-slate-700">
            <!-- Dynamic Rows Go Here -->
          </tbody>
        </table>
      </div>
      <div id="emptyState" class="hidden py-12 text-center text-slate-400 text-xs">
        <i class="fa-regular fa-folder-open text-3xl mb-2 text-pink-300"></i>
        <p>조건에 일치하는 데이터가 없습니다.</p>
      </div>
    </div>

  </main>

  <!-- Add/Edit Modal -->
  <div id="itemModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl border border-pink-100 overflow-hidden transform transition-all">
      <div class="bg-pink-500 px-6 py-4 flex items-center justify-between text-white">
        <h3 id="modalTitle" class="font-bold text-sm">새 PPL / 시딩 항목 추가</h3>
        <button onclick="closeAddModal()" class="text-white/80 hover:text-white transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <form id="itemForm" onsubmit="saveItem(event)" class="p-6 space-y-4 text-xs">
        <input type="hidden" id="itemId">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-semibold text-slate-600 mb-1">구분</label>
            <select id="formType" class="w-full bg-pink-50/50 border border-pink-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-pink-500" required>
              <option value="PPL">PPL</option>
              <option value="시딩">시딩</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-slate-600 mb-1">브랜드</label>
            <select id="formBrand" class="w-full bg-pink-50/50 border border-pink-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-pink-500" required>
              <option value="온살">온살</option>
              <option value="루메아카이브">루메아카이브</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block font-semibold text-slate-600 mb-1">인플루언서 / 채널명</label>
          <input type="text" id="formTarget" placeholder="예: 크리에이터 영이 / 인스타그램" class="w-full bg-pink-50/50 border border-pink-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-pink-500" required>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-semibold text-slate-600 mb-1">상태</label>
            <select id="formStatus" class="w-full bg-pink-50/50 border border-pink-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-pink-500" required>
              <option value="대기중">대기중</option>
              <option value="진행중">진행중</option>
              <option value="완료">완료</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-slate-600 mb-1">예산 (원)</label>
            <input type="number" id="formBudget" placeholder="0" class="w-full bg-pink-50/50 border border-pink-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-pink-500" required>
          </div>
        </div>
        <div>
          <label class="block font-semibold text-slate-600 mb-1">진행 일정</label>
          <input type="text" id="formSchedule" placeholder="예: 2026.08.10 - 08.15" class="w-full bg-pink-50/50 border border-pink-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-pink-500" required>
        </div>
        <div class="flex justify-end space-x-2 pt-4 border-t border-pink-100">
          <button type="button" onclick="closeAddModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-semibold transition">취소</button>
          <button type="submit" class="px-4 py-2 bg-pink-600 hover:bg-pink-700 text-white rounded-xl font-semibold transition">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxhugS7UVfBD1BhVUWYp1tRDEzcgweiC8NASMBOb5rk7A6skxkpWRc9KDToitxDPey3/exec";
    let dashboardData = [];

    async function fetchSheetData() {
      try {
        const response = await fetch(API_URL);
        const result = await response.json();
        dashboardData = result.map((row, index) => ({
          id: row.id || index + 1,
          type: row.type || 'PPL',
          brand: row.brand || '온살',
          target: row.target || '',
          status: row.status || '대기중',
          schedule: row.schedule || '',
          budget: Number(row.budget) || 0
        }));
        renderTable(dashboardData);
      } catch (error) {
        console.error("데이터를 불러오는 데 실패했습니다:", error);
      }
    }

    async function saveToServer(itemData) {
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(itemData)
        });
        setTimeout(fetchSheetData, 1000);
      } catch (error) {
        console.error("데이터 저장 실패:", error);
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('dataTableBody');
      const emptyState = document.getElementById('emptyState');
      tbody.innerHTML = '';

      if (data.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        data.forEach(item => {
          let statusBadge = '';
          if (item.status === '진행중') statusBadge = '<span class="px-2.5 py-1 bg-amber-50 text-amber-600 rounded-full font-medium">진행중</span>';
          else if (item.status === '완료') statusBadge = '<span class="px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-full font-medium">완료</span>';
          else statusBadge = '<span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full font-medium">대기중</span>';

          const tr = document.createElement('tr');
          tr.className = 'hover:bg-pink-50/40 transition';
          tr.innerHTML = `
            <td class="py-3.5 px-4 font-medium text-slate-500">#${item.id}</td>
            <td class="py-3.5 px-4"><span class="px-2 py-0.5 bg-pink-50 text-pink-600 rounded font-medium">${item.type}</span></td>
            <td class="py-3.5 px-4 font-semibold text-slate-800">${item.brand}</td>
            <td class="py-3.5 px-4 text-slate-900">${item.target}</td>
            <td class="py-3.5 px-4">${statusBadge}</td>
            <td class="py-3.5 px-4 text-slate-500">${item.schedule}</td>
            <td class="py-3.5 px-4 text-right font-semibold text-slate-800">₩${item.budget.toLocaleString()}</td>
            <td class="py-3.5 px-4 text-center">
              <button onclick="editItem(${item.id})" class="text-slate-400 hover:text-pink-600 p-1 transition"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteItem(${item.id})" class="text-slate-400 hover:text-red-500 p-1 transition ml-1"><i class="fa-solid fa-trash"></i></button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }
      updateSummary(data);
    }

    function updateSummary(data) {
      document.getElementById('totalCount').innerText = data.length;
      document.getElementById('progressCount').innerText = data.filter(i => i.status === '진행중').length;
      document.getElementById('completedCount').innerText = data.filter(i => i.status === '완료').length;
      const totalBudget = data.reduce((acc, cur) => acc + Number(cur.budget), 0);
      document.getElementById('totalBudget').innerText = '₩' + totalBudget.toLocaleString();
    }

    function filterTable() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const brand = document.getElementById('brandFilter').value;

      const filtered = dashboardData.filter(item => {
        const matchKeyword = item.target.toLowerCase().includes(keyword) || item.brand.toLowerCase().includes(keyword);
        const matchStatus = status === '' || item.status === status;
        const matchBrand = brand === '' || item.brand === brand;
        return matchKeyword && matchStatus && matchBrand;
      });

      renderTable(filtered);
    }

    function openAddModal() {
      document.getElementById('modalTitle').innerText = '새 PPL / 시딩 항목 추가';
      document.getElementById('itemId').value = '';
      document.getElementById('itemForm').reset();
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    function saveItem(event) {
      event.preventDefault();
      const id = document.getElementById('itemId').value;
      const type = document.getElementById('formType').value;
      const brand = document.getElementById('formBrand').value;
      const target = document.getElementById('formTarget').value;
      const status = document.getElementById('formStatus').value;
      const schedule = document.getElementById('formSchedule').value;
      const budget = Number(document.getElementById('formBudget').value);

      const newItem = {
        id: id ? Number(id) : (dashboardData.length > 0 ? Math.max(...dashboardData.map(i => i.id)) + 1 : 1),
        type, brand, target, status, schedule, budget
      };

      closeAddModal();
      saveToServer(newItem);
    }

    function editItem(id) {
      const item = dashboardData.find(i => i.id === id);
      if (!item) return;

      document.getElementById('modalTitle').innerText = '항목 수정';
      document.getElementById('itemId').value = item.id;
      document.getElementById('formType').value = item.type;
      document.getElementById('formBrand').value = item.brand;
      document.getElementById('formTarget').value = item.target;
      document.getElementById('formStatus').value = item.status;
      document.getElementById('formSchedule').value = item.schedule;
      document.getElementById('formBudget').value = item.budget;

      document.getElementById('itemModal').classList.remove('hidden');
    }

    function deleteItem(id) {
      if (confirm('정말 이 항목을 삭제하시겠습니까?')) {
        dashboardData = dashboardData.filter(i => i.id !== id);
        renderTable(dashboardData);
      }
    }

    function exportToExcel() {
      const wsData = [["ID", "구분", "브랜드", "인플루언서 / 채널", "상태", "진행 일정", "예산"]];
      dashboardData.forEach(item => {
        wsData.push([item.id, item.type, item.brand, item.target, item.status, item.schedule, item.budget]);
      });
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      XLSX.utils.book_append_sheet(wb, ws, "PPL_Seeding_Status");
      XLSX.writeFile(wb, "PPL_Seeding_Dashboard.xlsx");
    }

    window.onload = function() {
      fetchSheetData();
    };
  </script>
</body>
</html>
