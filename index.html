<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPL & 시딩 통합 관리 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col hidden md:flex">
            <div class="p-6 border-b border-slate-800">
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="layout-dashboard" class="text-indigo-400"></i> 통합 마케팅 대시보드
                </h1>
                <p class="text-xs text-slate-500 mt-1">PPL & Seeding Management</p>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="switchTab('ppl')" id="nav-ppl" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors bg-indigo-600 text-white">
                    <i data-lucide="kanban"></i> PPL 진행 대시보드
                </button>
                <button onclick="switchTab('seeding')" id="nav-seeding" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 text-slate-400">
                    <i data-lucide="box"></i> 시딩 샘플 & 재고 관리
                </button>
            </nav>
            <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
                <p>© 2026 Marketing Operations</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <!-- Top Header -->
            <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shadow-sm">
                <div class="flex items-center gap-4">
                    <h2 id="page-title" class="text-xl font-bold text-slate-800">PPL 진행 대시보드</h2>
                    <span id="page-badge" class="px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-semibold rounded-full">Live Tracking</span>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="resetData()" class="px-3 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
                        데이터 초기화
                    </button>
                </div>
            </header>

            <!-- Content Body -->
            <div class="p-8 max-w-7xl w-full mx-auto flex-1">
                <!-- PPL Tab View -->
                <section id="view-ppl" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs text-slate-500 font-medium">전체 PPL 건수</p>
                            <h3 id="stat-total" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs text-slate-500 font-medium">진행 중</p>
                            <h3 id="stat-ongoing" class="text-2xl font-bold text-indigo-600 mt-1">0</h3>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs text-slate-500 font-medium">촬영 완료</p>
                            <h3 id="stat-completed" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs text-slate-500 font-medium">업로드 완료</p>
                            <h3 id="stat-uploaded" class="text-2xl font-bold text-blue-600 mt-1">0</h3>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-slate-800">PPL 리스트 현황</h3>
                            <div class="flex gap-2">
                                <input type="text" id="search-ppl" placeholder="크리에이터/브랜드 검색..." oninput="renderPPL()" class="px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <button onclick="openPPLModal()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors">
                                    + PPL 추가
                                </button>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="border-b border-slate-200 bg-slate-50 text-slate-600">
                                        <th class="p-3">브랜드 / 제품</th>
                                        <th class="p-3">크리에이터</th>
                                        <th class="p-3">채널</th>
                                        <th class="p-3">상태</th>
                                        <th class="p-3">발송수량</th>
                                        <th class="p-3">일정</th>
                                        <th class="p-3 text-right">관리</th>
                                    </tr>
                                </thead>
                                <tbody id="ppl-table-body">
                                    <!-- Dynamic rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- Seeding & Inventory Tab View -->
                <section id="view-seeding" class="space-y-6 hidden">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs text-slate-500 font-medium">총 입고 수량</p>
                            <h3 id="inv-total-in" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs text-slate-500 font-medium">PPL/시딩 발송</p>
                            <h3 id="inv-total-out" class="text-2xl font-bold text-indigo-600 mt-1">0</h3>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs text-slate-500 font-medium">내부 소진 (촬영/테스트)</p>
                            <h3 id="inv-total-internal" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm bg-indigo-50/50 border-indigo-100">
                            <p class="text-xs text-indigo-600 font-medium">현재 남은 재고</p>
                            <h3 id="inv-current-stock" class="text-2xl font-bold text-indigo-700 mt-1">0</h3>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Inventory Actions -->
                        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-4">
                            <h3 class="font-bold text-slate-800 flex items-center gap-2">
                                <i data-lucide="plus-circle" class="text-indigo-600"></i> 재고 조정 및 입출고
                            </h3>
                            <form id="inventory-form" onsubmit="handleInventorySubmit(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1">구분</label>
                                    <select id="inv-type" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                        <option value="in">입고 (재고 추가)</option>
                                        <option value="internal">내부 소진 (촬영/테스트)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1">제품명</label>
                                    <input type="text" id="inv-item-name" required placeholder="예: 금귤 단자 세트" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1">수량</label>
                                    <input type="number" id="inv-qty" required min="1" value="10" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1">상세 메모 / 목적</label>
                                    <input type="text" id="inv-memo" placeholder="예: 정기 입고 / 스튜디오 촬영용" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                </div>
                                <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg transition-colors">
                                    기록 반영하기
                                </button>
                            </form>
                        </div>

                        <!-- History Timeline -->
                        <div class="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm p-6 flex flex-col">
                            <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
                                <i data-lucide="history" class="text-indigo-600"></i> 입출고 및 소진 이력 타임라인
                            </h3>
                            <div class="overflow-y-auto max-h-[400px] flex-1 space-y-3" id="timeline-container">
                                <!-- Dynamic History Items -->
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- PPL Add Modal -->
    <div id="ppl-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full mx-4 shadow-xl space-y-4">
            <h3 class="font-bold text-lg text-slate-800">새 PPL 등록</h3>
            <form id="ppl-form" onsubmit="handlePPLSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">브랜드 / 제품명</label>
                    <input type="text" id="ppl-brand" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">크리에이터 명</label>
                    <input type="text" id="ppl-creator" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">채널 (YouTube / Instagram 등)</label>
                    <input type="text" id="ppl-channel" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">상태</label>
                    <select id="ppl-status" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                        <option value="조율중">조율중</option>
                        <option value="테스트제품전달">테스트제품전달</option>
                        <option value="촬영완료">촬영완료</option>
                        <option value="업로드완료">업로드완료</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">발송 수량 (재고 자동 차감)</label>
                    <input type="number" id="ppl-qty" value="1" min="0" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">진행 일정</label>
                    <input type="date" id="ppl-date" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closePPLModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-medium rounded-lg">취소</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Initial Mock Data or LocalStorage
        let db = JSON.parse(localStorage.getItem('marketing_dashboard_db')) || {
            ppl: [
                { id: 1, brand: '한과 미위식 - 금귤단자', creator: '맛있는기록', channel: 'YouTube', status: '테스트제품전달', qty: 2, date: '2026-08-05' },
                { id: 2, brand: '한과 미위식 - 개성주악', creator: '디저트탐방가', channel: 'Instagram', status: '업로드완료', qty: 1, date: '2026-08-01' }
            ],
            inventory: [
                { id: 1, type: 'in', name: '금귤 단자 세트', qty: 50, memo: '정기 입고', date: '2026-08-01 10:00' },
                { id: 2, type: 'internal', name: '금귤 단자 세트', qty: 2, memo: '스튜디오 촬영용 소진', date: '2026-08-03 14:00' }
            ]
        };

        function saveData() {
            localStorage.setItem('marketing_dashboard_db', JSON.stringify(db));
        }

        function switchTab(tab) {
            const pplView = document.getElementById('view-ppl');
            const seedingView = document.getElementById('view-seeding');
            const navPpl = document.getElementById('nav-ppl');
            const navSeeding = document.getElementById('nav-seeding');
            const pageTitle = document.getElementById('page-title');
            const pageBadge = document.getElementById('page-badge');

            if (tab === 'ppl') {
                pplView.classList.remove('hidden');
                seedingView.classList.add('hidden');
                navPpl.className = "w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors bg-indigo-600 text-white";
                navSeeding.className = "w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 text-slate-400";
                pageTitle.innerText = "PPL 진행 대시보드";
                pageBadge.innerText = "Live Tracking";
                renderPPL();
            } else {
                pplView.classList.add('hidden');
                seedingView.classList.remove('hidden');
                navSeeding.className = "w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors bg-indigo-600 text-white";
                navPpl.className = "w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 text-slate-400";
                pageTitle.innerText = "시딩 샘플 & 재고 관리";
                pageBadge.innerText = "Inventory Control";
                renderInventory();
            }
            lucide.createIcons();
        }

        // PPL Logic
        function renderPPL() {
            const tbody = document.getElementById('ppl-table-body');
            const searchTerm = document.getElementById('search-ppl').value.toLowerCase();
            tbody.innerHTML = '';

            let total = db.ppl.length;
            let ongoing = 0, completed = 0, uploaded = 0;

            db.ppl.filter(item => item.brand.toLowerCase().includes(searchTerm) || item.creator.toLowerCase().includes(searchTerm)).forEach(item => {
                if (item.status === '조율중' || item.status === '테스트제품전달') ongoing++;
                if (item.status === '촬영완료') completed++;
                if (item.status === '업로드완료') uploaded++;

                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-100 hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="p-3 font-medium text-slate-800">${item.brand}</td>
                    <td class="p-3 text-slate-600">${item.creator}</td>
                    <td class="p-3"><span class="px-2 py-1 bg-slate-100 text-slate-600 text-xs rounded">${item.channel}</span></td>
                    <td class="p-3">
                        <select onchange="updatePPLStatus(${item.id}, this.value)" class="text-xs px-2 py-1 rounded border border-slate-200 bg-white font-medium">
                            <option value="조율중" ${item.status==='조율중'?'selected':''}>조율중</option>
                            <option value="테스트제품전달" ${item.status==='테스트제품전달'?'selected':''}>테스트제품전달</option>
                            <option value="촬영완료" ${item.status==='촬영완료'?'selected':''}>촬영완료</option>
                            <option value="업로드완료" ${item.status==='업로드완료'?'selected':''}>업로드완료</option>
                        </select>
                    </td>
                    <td class="p-3 text-slate-600 font-semibold">${item.qty}개</td>
                    <td class="p-3 text-slate-500 text-xs">${item.date || '-'}</td>
                    <td class="p-3 text-right">
                        <button onclick="deletePPL(${item.id})" class="text-rose-500 hover:text-rose-700 text-xs font-medium">삭제</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-ongoing').innerText = ongoing;
            document.getElementById('stat-completed').innerText = completed;
            document.getElementById('stat-uploaded').innerText = uploaded;
        }

        function openPPLModal() {
            document.getElementById('ppl-modal').classList.remove('hidden');
            document.getElementById('ppl-modal').classList.add('flex');
        }

        function closePPLModal() {
            document.getElementById('ppl-modal').classList.add('hidden');
            document.getElementById('ppl-modal').classList.remove('flex');
        }

        function handlePPLSubmit(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                brand: document.getElementById('ppl-brand').value,
                creator: document.getElementById('ppl-creator').value,
                channel: document.getElementById('ppl-channel').value,
                status: document.getElementById('ppl-status').value,
                qty: parseInt(document.getElementById('ppl-qty').value) || 0,
                date: document.getElementById('ppl-date').value
            };

            db.ppl.unshift(newItem);

            // If status involves shipping, record in inventory as out
            if (newItem.qty > 0) {
                db.inventory.unshift({
                    id: Date.now() + 1,
                    type: 'out',
                    name: newItem.brand,
                    qty: newItem.qty,
                    memo: `PPL 발송 (${newItem.creator})`,
                    date: new Date().toISOString().slice(0, 16).replace('T', ' ')
                });
            }

            saveData();
            closePPLModal();
            renderPPL();
        }

        function updatePPLStatus(id, newStatus) {
            const item = db.ppl.find(p => p.id === id);
            if (item) {
                item.status = newStatus;
                saveData();
                renderPPL();
            }
        }

        function deletePPL(id) {
            db.ppl = db.ppl.filter(p => p.id !== id);
            saveData();
            renderPPL();
        }

        // Inventory Logic
        function renderInventory() {
            let totalIn = 0;
            let totalOut = 0;
            let totalInternal = 0;

            const timelineContainer = document.getElementById('timeline-container');
            timelineContainer.innerHTML = '';

            db.inventory.forEach(inv => {
                if (inv.type === 'in') totalIn += inv.qty;
                if (inv.type === 'out') totalOut += inv.qty;
                if (inv.type === 'internal') totalInternal += inv.qty;

                const badgeColor = inv.type === 'in' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : (inv.type === 'out' ? 'bg-indigo-50 text-indigo-600 border-indigo-200' : 'bg-amber-50 text-amber-600 border-amber-200');
                const typeLabel = inv.type === 'in' ? '입고' : (inv.type === 'out' ? 'PPL 발송' : '내부 소진');
                const qtyPrefix = inv.type === 'in' ? '+' : '-';

                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 rounded-lg border border-slate-100 bg-slate-50/50 text-sm";
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="px-2 py-0.5 text-xs font-semibold rounded border ${badgeColor}">${typeLabel}</span>
                        <div>
                            <p class="font-medium text-slate-800">${inv.name}</p>
                            <p class="text-xs text-slate-500">${inv.memo || '메모 없음'} · <span class="text-slate-400">${inv.date}</span></p>
                        </div>
                    </div>
                    <span class="font-bold ${inv.type === 'in' ? 'text-emerald-600' : 'text-slate-700'}">${qtyPrefix}${inv.qty}개</span>
                `;
                timelineContainer.appendChild(div);
            });

            document.getElementById('inv-total-in').innerText = totalIn + '개';
            document.getElementById('inv-total-out').innerText = totalOut + '개';
            document.getElementById('inv-total-internal').innerText = totalInternal + '개';
            document.getElementById('inv-current-stock').innerText = (totalIn - totalOut - totalInternal) + '개';
        }

        function handleInventorySubmit(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                type: document.getElementById('inv-type').value,
                name: document.getElementById('inv-item-name').value,
                qty: parseInt(document.getElementById('inv-qty').value),
                memo: document.getElementById('inv-memo').value,
                date: new Date().toISOString().slice(0, 16).replace('T', ' ')
            };

            db.inventory.unshift(newItem);
            saveData();
            document.getElementById('inventory-form').reset();
            renderInventory();
        }

        function resetData() {
            if (confirm('모든 데이터가 초기화됩니다. 진행하시겠습니까?')) {
                localStorage.removeItem('marketing_dashboard_db');
                location.reload();
            }
        }

        // Initialize Lucide icons on load
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderPPL();
        });
    </script>
</body>
</html>
