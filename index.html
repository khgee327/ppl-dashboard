<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온살 체험단 & PPL 대시보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { background-color: #f5f6f8; color: #333; padding: 20px; }
    
    /* 상단 네비게이션 탭 */
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; }
    .tab-btn { padding: 10px 20px; font-size: 16px; font-weight: bold; border: none; background: none; cursor: pointer; color: #666; border-radius: 6px; }
    .tab-btn.active { background: #4A90E2; color: white; }

    /* 컨텐츠 섹션 */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 카드 스타일 */
    .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h2 { margin-bottom: 15px; font-size: 18px; color: #2c3e50; }

    /* 폼 스타일 */
    .form-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    .form-group input, .form-group select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
    .btn-add { background: #2ECC71; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }

    /* 테이블 스타일 */
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th, td { padding: 12px; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; color: #555; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-ing { background: #E3F2FD; color: #1976D2; }

    /* 캘린더 간단 뷰 */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; text-align: center; }
    .day-box { background: white; min-height: 100px; padding: 8px; border-radius: 8px; border: 1px solid #eee; text-align: left; }
    .day-number { font-weight: bold; margin-bottom: 5px; font-size: 12px; color: #888; }
    .event-tag { background: #FFEBEE; color: #C62828; font-size: 11px; padding: 3px 6px; border-radius: 3px; margin-bottom: 3px; display: block; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 1. 탭 메뉴 -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('experience')">📢 체험단 관리 (온살)</button>
    <button class="tab-btn" onclick="switchTab('scheduler')">📅 스케줄러 (달력)</button>
  </div>

  <!-- 2. 체험단 관리 탭 -->
  <div id="experience" class="tab-content active">
    <!-- 등록 폼 -->
    <div class="card">
      <h2>✨ 신규 체험단 캠페인 추가</h2>
      <div class="form-group">
        <input type="text" id="sponsorName" placeholder="협찬명 (예: 비피다_X20)">
        <input type="text" id="productName" placeholder="제품명 (예: 비피다)">
        <input type="number" id="count" placeholder="인원(명)" style="width: 80px;">
        <input type="text" id="channel" placeholder="채널 (예: 인스타그램)">
        <label style="font-size: 12px; align-self: center;">마감일:</label>
        <input type="date" id="deadline">
        <button class="btn-add" onclick="addCampaign()">등록하기</button>
      </div>
    </div>

    <!-- 현황 리스트 -->
    <div class="card">
      <h2>📋 진행 중인 체험단 목록</h2>
      <table>
        <thead>
          <tr>
            <th>협찬명</th>
            <th>제품명</th>
            <th>인원</th>
            <th>채널</th>
            <th>업로드 마감일</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody id="campaignTableBody">
          <!-- 등록된 데이터가 들어옵니다 -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- 3. 스케줄러 탭 -->
  <div id="scheduler" class="tab-content">
    <div class="card">
      <h2>📅 체험단 연동 스케줄러 (이번 달 일정)</h2>
      <div class="calendar-grid" id="calendarGrid">
        <!-- 달력 날짜와 자동 등록된 이벤트가 표시됩니다 -->
      </div>
    </div>
  </div>

  <script>
    // 기본 데이터 샘플
    let campaigns = [
      { id: 1, sponsorName: '비피다_X20', productName: '비피다', count: 20, channel: 'X(트위터)', deadline: '2026-08-05', status: '진행중' },
      { id: 2, sponsorName: '비타민C_X20', productName: '비타민C', count: 20, channel: '인스타그램', deadline: '2026-08-12', status: '진행중' }
    ];

    // 탭 전환 함수
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');

      if(tabId === 'scheduler') renderCalendar();
    }

    // 체험단 목록 불러오기
    function renderCampaigns() {
      const tbody = document.getElementById('campaignTableBody');
      tbody.innerHTML = '';
      
      campaigns.forEach(item => {
        tbody.innerHTML += `
          <tr>
            <td><b>${item.sponsorName}</b></td>
            <td>${item.productName}</td>
            <td>${item.count}명</td>
            <td>${item.channel}</td>
            <td style="color: #e74c3c; font-weight: bold;">${item.deadline}</td>
            <td><span class="badge badge-ing">${item.status}</span></td>
          </tr>
        `;
      });
    }

    // 신규 체험단 추가
    function addCampaign() {
      const sponsorName = document.getElementById('sponsorName').value;
      const productName = document.getElementById('productName').value;
      const count = document.getElementById('count').value;
      const channel = document.getElementById('channel').value;
      const deadline = document.getElementById('deadline').value;

      if(!sponsorName || !deadline) {
        alert('협찬명과 마감일은 꼭 입력해주세요!');
        return;
      }

      campaigns.push({
        id: Date.now(),
        sponsorName,
        productName,
        count,
        channel,
        deadline,
        status: '진행중'
      });

      alert('체험단이 등록되었습니다! 스케줄러(달력)에도 자동 반영됩니다.');
      
      // 입력창 초기화 및 리프레시
      document.getElementById('sponsorName').value = '';
      document.getElementById('productName').value = '';
      renderCampaigns();
    }

    // 스케줄러(달력) 그리기 & 체험단 일정 자동 연동
    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      // 임시로 1일~31일 달력 생성
      for (let day = 1; day <= 31; day++) {
        const dayString = `2026-08-${day < 10 ? '0' + day : day}`;
        
        // 해당 날짜에 마감인 체험단 찾기
        const matchedEvents = campaigns.filter(c => c.deadline === dayString);

        let eventHtml = '';
        matchedEvents.forEach(e => {
          eventHtml += `<span class="event-tag">🚨 [마감] ${e.sponsorName}</span>`;
        });

        grid.innerHTML += `
          <div class="day-box">
            <div class="day-number">8/${day}</div>
            ${eventHtml}
          </div>
        `;
      }
    }

    // 초기 실행
    renderCampaigns();
  </script>
</body>
</html>
